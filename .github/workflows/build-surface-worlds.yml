name: Build historical surface worlds

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-surface-writer
  cancel-in-progress: false

jobs:
  build-250-ma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned geospatial build dependencies
        run: >-
          python -m pip install
          numpy==2.5.1
          scipy==1.18.0
          xarray==2026.7.0
          netCDF4==1.7.4
          Pillow==12.3.0

      - name: Generate the 250 Ma surface package
        run: python scripts/build_surface_worlds.py --age 250 --max-zoom 3

      - name: Validate generated assets
        run: |
          test -f data/surface/worlds/250-ma/world.json
          test -f data/surface/worlds/250-ma/color/0/0/0.png
          test -f data/surface/worlds/250-ma/dem/0/0/0.png
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/surface/worlds.json').read_text())
          world = next(item for item in manifest['worlds'] if item['id'] == '250-ma')
          assert world['status'] == 'generated'
          assert world['builderVersion'] == 2
          assert world['assets']['maxzoom'] == 3
          print(world['actualAgeMa'], world['assets'])
          PY

      - name: Upload visual QA package
        uses: actions/upload-artifact@v4
        with:
          name: surface-preview-${{ github.sha }}
          path: |
            data/surface/worlds/250-ma/world.json
            data/surface/worlds/250-ma/color
            data/surface/worlds/250-ma/dem/0/0/0.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated package
        run: |
          if git diff --quiet -- data/surface; then
            echo 'Surface package already current.'
            exit 0
          fi
          git config user.name 'worldline-surface-bot'
          git config user.email 'worldline-surface-bot@users.noreply.github.com'
          git add data/surface
          git commit -m 'Generate 250 Ma reconstructed surface package'
          git push
