name: Validate static app

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  generate-surface:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/surface-engine-r20') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/surface-engine-r20'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: historical-surface-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the surface branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface-engine-r20
          fetch-depth: 0
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned surface build dependencies
        run: >-
          python -m pip install
          numpy==2.5.1
          scipy==1.18.0
          xarray==2026.7.0
          netCDF4==1.7.4
          Pillow==12.3.0
      - name: Generate the 250 Ma surface package
        run: python scripts/build_surface_worlds.py --age 250 --max-zoom 3
      - name: Upload visual QA package
        uses: actions/upload-artifact@v4
        with:
          name: surface-preview-${{ github.sha }}
          path: |
            data/surface/worlds/250-ma/world.json
            data/surface/worlds/250-ma/color
            data/surface/worlds/250-ma/dem/0/0/0.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated surface assets
        run: |
          if git diff --quiet -- data/surface; then
            echo 'Surface package already current.'
            exit 0
          fi
          git config user.name 'worldline-surface-bot'
          git config user.email 'worldline-surface-bot@users.noreply.github.com'
          git add data/surface
          git commit -m 'Generate 250 Ma reconstructed surface package'
          git push origin HEAD:agent/surface-engine-r20

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser and function JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check map-core.js
          node --check map-layers.js
          node --check reconstruction.js
          node --check reconstruction-packages.js
          node --check bootstrap.js
          node --check mobile-polish.js
          node --check interaction-system.js
          node --check landmark-visibility.js
          node --check ui-state.js
          node --check ui-adapters.js
          node --check search-index.js
          node --check history-catalog.js
          node --check history-engine.js
          node --check history-presence-r14.js
          node --check mobile-search-snap-r15.js
          node --check time-control-r16.js
          node --check research-foundation-r17.js
          node --check atlas-timeline-state-r18.js
          node --check atlas-timeline-r18.js
          node --check surface-engine-r20.js
          node --check apple-controls-loader.js
          node --check apple-controls.js
          node --check earth-history.js
          node --check earth-era-context.js
          node --check earth-ui-sync.js
          node --check earth-cache.js
          node --check life-evidence.js
          node --check apple-timeline-r11.js
          node --check r12-ui.js
          node --check netlify/functions/settlements.js
          node --check netlify/functions/place-summary.js
          node --check netlify/functions/paleocoastlines.js
          node --check scripts/cache-earth-data.mjs
          node --check scripts/validate-reconstructions.mjs
          node --check scripts/validate-ui.mjs
          node --check scripts/validate-search.mjs
          node --check scripts/validate-earth-history.mjs
          node --check scripts/validate-earth-cache.mjs
          node --check scripts/validate-history-engine.mjs
          node --check scripts/validate-research-foundation.mjs
          node --check scripts/validate-timeline-controller.mjs
          node --check scripts/validate-surface-engine.mjs
      - name: Check Python builders
        run: python -m py_compile scripts/build_surface_worlds.py
      - name: Validate reconstruction packages
        run: node scripts/validate-reconstructions.mjs
      - name: Validate UI wiring
        run: node scripts/validate-ui.mjs
      - name: Validate authoritative timeline controller
        run: node scripts/validate-timeline-controller.mjs
      - name: Validate historical search
        run: node scripts/validate-search.mjs
      - name: Validate Earth history
        run: node scripts/validate-earth-history.mjs
      - name: Validate cached Earth and regional life evidence
        run: node scripts/validate-earth-cache.mjs
      - name: Validate researched chronology and first-load presence
        run: node scripts/validate-history-engine.mjs
      - name: Validate research foundation
        run: node scripts/validate-research-foundation.mjs
      - name: Validate historical surface worlds
        run: node scripts/validate-surface-engine.mjs
