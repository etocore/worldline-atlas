name: Validate static app

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  generate-surface:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/surface-engine-r20') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/surface-engine-r20'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: historical-surface-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the surface branch
        uses: actions/checkout@v4
        with:
          ref: agent/surface-engine-r20
          fetch-depth: 0
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned surface build dependencies
        run: >-
          python -m pip install
          numpy==2.5.1
          scipy==1.18.0
          xarray==2026.7.0
          netCDF4==1.7.4
          Pillow==12.3.0
      - name: Generate the 250 Ma surface package
        run: python scripts/build_surface_worlds.py --age 250 --max-zoom 3
      - name: Upload visual QA package
        uses: actions/upload-artifact@v4
        with:
          name: surface-preview-${{ github.sha }}
          path: |
            data/surface/worlds/250-ma/world.json
            data/surface/worlds/250-ma/color
            data/surface/worlds/250-ma/dem/0/0/0.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated surface assets
        run: |
          if git diff --quiet -- data/surface; then
            echo 'Surface package already current.'
            exit 0
          fi
          git config user.name 'worldline-surface-bot'
          git config user.email 'worldline-surface-bot@users.noreply.github.com'
          git add data/surface
          git commit -m 'Generate 250 Ma reconstructed surface package'
          git push origin HEAD:agent/surface-engine-r20

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser and function JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check map-core.js
          node --check map-layers.js
          node --check reconstruction.js
          node --check reconstruction-packages.js
          node --check bootstrap.js
          node --check mobile-polish.js
          node --check interaction-system.js
          node --check landmark-visibility.js
          node --check ui-state.js
          node --check ui-adapters.js
          node --check search-index.js
          node --check history-catalog.js
          node --check history-engine.js
          node --check history-presence-r14.js
          node --check mobile-search-snap-r15.js
          node --check time-control-r16.js
          node --check research-foundation-r17.js
          node --check atlas-timeline-state-r18.js
          node --check atlas-timeline-r18.js
          node --check surface-engine-r20.js
          node --check ios-interface-r21.js
          node --check apple-controls-loader.js
          node --check apple-controls.js
          node --check earth-history.js
          node --check earth-era-context.js
          node --check earth-ui-sync.js
          node --check earth-cache.js
          node --check life-evidence.js
          node --check apple-timeline-r11.js
          node --check r12-ui.js
          node --check netlify/functions/settlements.js
          node --check netlify/functions/place-summary.js
          node --check netlify/functions/paleocoastlines.js
          node --check scripts/cache-earth-data.mjs
          node --check scripts/validate-reconstructions.mjs
          node --check scripts/validate-ui.mjs
          node --check scripts/validate-search.mjs
          node --check scripts/validate-earth-history.mjs
          node --check scripts/validate-earth-cache.mjs
          node --check scripts/validate-history-engine.mjs
          node --check scripts/validate-research-foundation.mjs
          node --check scripts/validate-timeline-controller.mjs
          node --check scripts/validate-surface-engine.mjs
          node --check scripts/validate-ios-interface.mjs
          node --check playwright.config.mjs
          node --check tests/e2e/ios-interface.spec.mjs
          node --check tests/simulator/ios-safari-smoke.mjs
      - name: Check Python builders
        run: python -m py_compile scripts/build_surface_worlds.py
      - name: Validate reconstruction packages
        run: node scripts/validate-reconstructions.mjs
      - name: Validate UI wiring
        run: node scripts/validate-ui.mjs
      - name: Validate authoritative timeline controller
        run: node scripts/validate-timeline-controller.mjs
      - name: Validate historical search
        run: node scripts/validate-search.mjs
      - name: Validate Earth history
        run: node scripts/validate-earth-history.mjs
      - name: Validate cached Earth and regional life evidence
        run: node scripts/validate-earth-cache.mjs
      - name: Validate researched chronology and first-load presence
        run: node scripts/validate-history-engine.mjs
      - name: Validate research foundation
        run: node scripts/validate-research-foundation.mjs
      - name: Validate historical surface worlds
        run: node scripts/validate-surface-engine.mjs
      - name: Validate iOS interface architecture
        run: node scripts/validate-ios-interface.mjs

  mobile-interface:
    name: Mobile WebKit interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install pinned WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Run compact iPhone, large iPhone, and iPad regressions
        run: npm run test:mobile
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webkit-failure-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  ios-simulator-safari:
    name: iOS Simulator Safari (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: iphone-se
            device: iPhone SE (3rd generation)
          - slug: iphone-pro-max
            device: iPhone 16 Pro Max
          - slug: ipad
            device: iPad (10th generation)
    env:
      PLATFORM_VERSION: '18.5'
      TARGET_URL: http://127.0.0.1:4173/tests/fixtures/ios-interface.html
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure isolated simulator paths
        run: |
          echo "APPIUM_HOME=$GITHUB_WORKSPACE/.appium" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$GITHUB_WORKSPACE/simulator-artifacts/${{ matrix.slug }}" >> "$GITHUB_ENV"
      - name: Select Xcode 16.4 and inspect simulator inventory
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list > /dev/null
          xcrun simctl list runtimes
      - name: Install pinned Appium and XCUITest driver
        run: |
          npm install --no-save --no-audit --no-fund appium@3.4.2
          npx appium driver install --source=npm appium-xcuitest-driver@11.7.3
          npx appium driver list --installed
      - name: Resolve and boot the iOS 18.5 simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          inventory = json.loads(subprocess.check_output([
              'xcrun', 'simctl', 'list', 'devices', 'available', '-j'
          ]))
          runtime = next(
              (key for key in inventory['devices'] if key.endswith('iOS-18-5')),
              None
          )
          if runtime is None:
              raise SystemExit('The macOS runner does not contain an iOS 18.5 simulator runtime')

          device_name = os.environ['DEVICE_NAME']
          matches = [
              device for device in inventory['devices'][runtime]
              if device['name'] == device_name and device.get('isAvailable', True)
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f'Expected one available {device_name} simulator in {runtime}, found {len(matches)}'
              )

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"SIMULATOR_UDID={matches[0]['udid']}\n")
          print(f"Resolved {device_name}: {matches[0]['udid']}")
          PY

          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl list devices | grep "$SIMULATOR_UDID"
      - name: Start deterministic Worldline fixture server
        run: |
          mkdir -p "$ARTIFACT_DIR"
          nohup python3 -m http.server 4173 --bind 0.0.0.0 \
            > "$ARTIFACT_DIR/http-server.log" 2>&1 &
          echo $! > "$ARTIFACT_DIR/http-server.pid"
          for attempt in {1..30}; do
            if curl --fail --silent "$TARGET_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$ARTIFACT_DIR/http-server.log"
          exit 1
      - name: Start Appium XCUITest server
        run: |
          nohup npx appium \
            --address 127.0.0.1 \
            --port 4723 \
            --base-path / \
            --log "$ARTIFACT_DIR/appium.log" \
            --log-timestamp \
            > "$ARTIFACT_DIR/appium-console.log" 2>&1 &
          echo $! > "$ARTIFACT_DIR/appium.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$ARTIFACT_DIR/appium-console.log"
          exit 1
      - name: Exercise Worldline in real iOS Simulator Safari
        env:
          DEVICE_NAME: ${{ matrix.device }}
          APPIUM_URL: http://127.0.0.1:4723
        run: node tests/simulator/ios-safari-smoke.mjs
      - name: Capture simulator failure evidence
        if: failure()
        run: |
          mkdir -p "$ARTIFACT_DIR"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$ARTIFACT_DIR/native-simulator.png" || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show \
            --last 10m \
            --style compact \
            > "$ARTIFACT_DIR/simulator.log" 2>&1 || true
          xcrun simctl list devices > "$ARTIFACT_DIR/simulator-inventory.txt" || true
      - name: Upload iOS Simulator failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-safari-${{ matrix.slug }}-${{ github.sha }}
          path: simulator-artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "$SIMULATOR_UDID" || true
