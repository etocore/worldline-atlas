<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Worldline hierarchical timeline fixture</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../apple-controls.css" />
  <link rel="stylesheet" href="../../ios-interface-r21.css" />
  <link rel="stylesheet" href="../../interface-reduction-r22.css" />
  <link rel="stylesheet" href="../../timeline-navigation-r23.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020305; }
    .map-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .fixture-map { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #153b56, #06101a 48%, #010203 100%); }
    .search-shell { position: absolute; z-index: 8; left: 50%; bottom: 10px; width: min(520px, calc(100% - 20px)); transform: translateX(-50%); }
    .search-shell:not(.is-open) .control-panel { display: none; }
    .search-row { min-height: 52px; border-radius: 26px; background: rgba(24, 24, 27, .94); }
    .timeline-hud[data-open="false"] { opacity: 0; pointer-events: none; }
    button, input { font: inherit; }
  </style>
</head>
<body class="timeline-active" data-ui-surface="timeline">
  <main class="map-stage" aria-label="Timeline fixture map">
    <div class="fixture-map" aria-hidden="true"></div>

    <section id="timelineHud" class="timeline-hud" data-open="true" aria-hidden="false" aria-label="Historical timeline">
      <header class="timeline-hud-header">
        <div><h2 id="timelineHudValue" class="timeline-hud-value">250 Ma</h2></div>
        <button id="timelineHudClose" class="timeline-hud-close" type="button" aria-label="Close timeline">×</button>
      </header>
      <input id="timelinePrimarySlider" class="timeline-primary-slider" type="range" min="0" max="1000" value="500" />
    </section>

    <section id="searchShell" class="search-shell" data-detent="compact" aria-label="Search and settings">
      <button id="sheetHandle" class="sheet-handle" type="button" aria-label="Expand settings"><span></span></button>
      <div class="search-row"><input id="historySearch" type="search" aria-label="Search" /></div>
      <div id="controlPanel" class="control-panel">
        <header class="panel-header">
          <div>
            <p class="panel-kicker">Worldline Atlas</p>
            <h1 id="timelineDate">250 Ma</h1>
          </div>
          <div class="panel-actions">
            <span id="sourceStatus" class="status-pill">Sources ready</span>
            <button id="aboutButton" class="round-button" type="button" aria-label="Sources and limitations">i</button>
            <button id="sheetClose" class="round-button" type="button" aria-label="Close settings">×</button>
          </div>
        </header>
        <p class="era-summary">Old duplicate timeline context.</p>
        <div class="metric-grid"><div><span>Visible records</span><strong>128</strong></div></div>
        <p class="coverage-message">Old dashboard coverage copy.</p>
        <div class="timeline-block"><input type="range" aria-label="Duplicate timeline" /></div>
        <div class="quick-years"><button type="button">117 CE</button></div>
        <section class="surface-control"><p>Old surface mode selector.</p></section>
        <div class="control-grid">
          <div class="control-block">
            <label for="fixtureEvidence"><span>Reconstruction tolerance</span><strong>Balanced</strong></label>
            <input id="fixtureEvidence" type="range" min="0" max="2" step="1" value="1" />
            <div class="range-ends"><span>Strictly dated</span><span>Broader</span></div>
          </div>
          <fieldset class="layer-block">
            <legend>Human-history layers</legend>
            <label><span>Dated map records</span><input type="checkbox" checked /></label>
            <label><span>Reviewed sites</span><input type="checkbox" checked /></label>
            <label><span>Live catalog</span><input type="checkbox" checked /></label>
            <label><span>Dated buildings</span><input type="checkbox" /></label>
          </fieldset>
        </div>
        <div class="legend">Old legend</div>
        <p class="imagery-note">Old long limitations paragraph.</p>
      </div>
    </section>
  </main>

  <script>
    window.__fixturePreviewFetches = [];
    window.__fixtureSourceUpdates = [];
    window.map = {
      getSource(id) {
        if (id !== 'paleo-coastlines') return null;
        return {
          setData(collection) {
            window.__fixtureSourceUpdates.push(collection);
          }
        };
      }
    };

    window.fetch = async (input) => {
      const url = String(input);
      if (url.includes('/api/paleocoastlines')) {
        const time = Number(new URL(url, location.origin).searchParams.get('time'));
        window.__fixturePreviewFetches.push(time);
        return {
          ok: true,
          async json() {
            return {
              time,
              collection: {
                type: 'FeatureCollection',
                features: [{ type: 'Feature', properties: { time }, geometry: null }]
              }
            };
          }
        };
      }
      return { ok: true, async json() { return {}; } };
    };

    window.WorldlineEarthHistory = Object.freeze({
      BUILD: 'fixture-earth',
      getMode() { return window.WorldlineTimelineState?.getState().domain || 'earth'; },
      getEarthAgeMa() { return window.WorldlineTimelineState?.getState().earthAgeMa || 250; },
      getHumanYear() { return window.WorldlineTimelineState?.getState().humanYear || -10000; },
      setMode() {},
      setEarthAge() {},
      setHumanYear() {},
      earthMilestones: [],
      humanMilestones: []
    });

    window.WorldlineUI = Object.freeze({
      close(surface) {
        if (surface === 'timeline') {
          document.querySelector('#timelineHud').dataset.open = 'false';
          document.body.classList.remove('timeline-active');
        }
      },
      activate(surface) {
        if (surface === 'settings') {
          document.querySelector('#searchShell').classList.add('is-open');
          document.querySelector('#searchShell').dataset.detent = 'expanded';
          document.querySelector('#timelineHud').dataset.open = 'false';
          document.body.classList.remove('timeline-active');
          document.body.dataset.uiSurface = 'settings';
        }
      }
    });

    window.__WORLDLINE_TIMELINE_CONTROLLER_BUILD__ = 'fixture-controller';
  </script>
  <script src="../../atlas-timeline-state-r18.js"></script>
  <script src="../../timeline-navigation-r23.js"></script>
  <script>
    const readyTimer = setInterval(() => {
      if (!window.__WORLDLINE_TIMELINE_NAVIGATION_BUILD__) return;
      clearInterval(readyTimer);
      document.body.dataset.fixtureReady = 'true';
    }, 20);
  </script>
</body>
</html>
